<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶龙记账 · 设计基准原型 v2.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='40' fill='%23FFD93D'/><circle cx='38' cy='48' r='6' fill='%23333'/><circle cx='62' cy='48' r='6' fill='%23333'/></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:#E8D9B8;
    color:#5D4E37;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  /* 手机外壳 */
  .phone {
    width:390px; height:844px;
    background:#FFF8E7;
    border-radius:44px;
    box-shadow:0 30px 80px rgba(93,78,55,.25), 0 0 0 10px #2A2A2A, 0 0 0 12px #111;
    overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  @media (max-width:480px){
    body{padding:0;background:#FFF8E7;}
    .phone{width:100%;height:100vh;border-radius:0;box-shadow:none;}
  }
  /* 状态栏 */
  .statusbar{
    height:44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:14px; font-weight:600; color:#5D4E37;
    flex-shrink:0;
  }
  /* 视图容器 */
  .views{flex:1; position:relative; overflow:hidden;}
  .view{position:absolute; inset:0; overflow-y:auto; display:none; padding-bottom:90px;}
  .view.active{display:block;}

  /* 通用 */
  .navbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 20px 4px;
  }
  .navbar h1{font-size:20px; font-weight:800; color:#5D4E37;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;background:#FFE9A8;
    display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;fill:#8A7450;}

  /* 月份切换 */
  .month-switch{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 0 4px;}
  .month-switch .arr{width:28px;height:28px;border-radius:50%;background:#FFE9A8;border:none;cursor:pointer;color:#8A7450;font-size:14px;}
  .month-switch .label{font-weight:700;font-size:16px;color:#5D4E37;}
  .month-sub{text-align:center;font-size:12px;color:#B8A584;margin-top:2px;}

  /* 余额卡 */
  .balance-card{
    margin:12px 16px; padding:20px; border-radius:24px;
    background:linear-gradient(135deg,#FFE082 0%,#FFD93D 100%);
    position:relative; overflow:visible;
    box-shadow:0 10px 24px rgba(255,217,61,.35);
  }
  .balance-card .milo{
    position:absolute; top:-30px; right:10px; width:90px; height:90px;
    object-fit:contain; filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));
  }
  .balance-num{font-size:34px; font-weight:800; color:#5D4E37; letter-spacing:-1px;}
  .balance-row{display:flex; gap:16px; margin-top:8px; font-size:13px;}
  .balance-row .inc{color:#2E8B57;font-weight:700;}
  .balance-row .exp{color:#5D4E37;}
  .heart{position:absolute; right:16px; bottom:14px; color:#FF8FA3; font-size:18px;}

  /* 分段控制器 */
  .seg{
    margin:8px 16px; background:#FFE9A8; border-radius:999px; padding:4px;
    display:flex;
  }
  .seg button{
    flex:1; border:none; background:transparent; padding:8px 0; border-radius:999px;
    font-size:14px; font-weight:700; color:#B89968; cursor:pointer;
  }
  .seg button.on{background:#FFD93D; color:#5D4E37; box-shadow:0 2px 6px rgba(0,0,0,.08);}

  /* 流水列表 */
  .txn-card{margin:12px 16px; background:#fff; border-radius:20px; padding:8px 16px;}
  .day-label{font-size:12px;color:#B8A584;padding:12px 0 6px;font-weight:600;}
  .txn-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #FFF3D6;}
  .txn-row:last-child{border-bottom:none;}
  .txn-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .txn-ic svg{width:20px;height:20px;fill:#fff;}
  .txn-name{flex:1;font-size:14px;color:#5D4E37;font-weight:600;}
  .txn-amt{font-size:15px;font-weight:800;color:#5D4E37;}
  .txn-amt.inc{color:#2E8B57;}

  /* FAB */
  .fab{
    position:absolute; right:20px; bottom:110px;
    width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#FFE97A,#FFC93C);
    border:none; cursor:pointer; z-index:5;
    box-shadow:0 8px 20px rgba(255,201,60,.5);
    display:flex;align-items:center;justify-content:center;
  }
  .fab svg{width:26px;height:26px;fill:#fff;}

  /* 底部 Tab */
  .tabbar{
    position:absolute; left:0;right:0;bottom:0;height:80px;
    background:#fff; border-top:1px solid #FFF3D6;
    display:flex; align-items:center; padding-bottom:12px;
    z-index:10;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#B8A584;border:none;background:none;}
  .tab svg{width:22px;height:22px;fill:currentColor;}
  .tab span{font-size:10px;font-weight:600;}
  .tab.on{color:#E8A317;}
  .tab.center{position:relative;}
  .tab .plus{
    width:48px;height:48px;border-radius:50%;background:#FFD93D;
    display:flex;align-items:center;justify-content:center;margin-top:-24px;
    box-shadow:0 6px 14px rgba(255,201,60,.5);
  }
  .tab .plus svg{width:22px;height:22px;fill:#fff;}

  /* ===== 记一笔 ===== */
  .add-head{
    background:linear-gradient(180deg,#FFD93D,#FFE9A8);
    padding:12px 20px 24px; border-radius:0 0 28px 28px;
  }
  .add-head .navbar h1{color:#5D4E37;}
  .add-head .navbar .icon-btn{background:rgba(255,255,255,.4);}
  .type-switch{display:flex;justify-content:center;gap:20px;margin:8px 0 16px;}
  .type-switch button{background:none;border:none;font-size:15px;color:rgba(93,78,55,.5);font-weight:600;padding:4px 8px;cursor:pointer;}
  .type-switch button.on{color:#5D4E37;border-bottom:3px solid #5D4E37;}
  .big-amount{font-size:40px;font-weight:800;color:#5D4E37;letter-spacing:-1px;}
  .big-amount .yen{font-size:24px;margin-right:4px;}
  .amount-hint{font-size:12px;color:rgba(93,78,55,.5);margin-top:2px;}
  .note{
    margin:16px; background:#fff; border-radius:14px; padding:12px 16px;
    font-size:13px; color:#B8A584;
  }
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:8px 20px;}
  .cat{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;}
  .cat .cic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .cat .cic svg{width:26px;height:26px;fill:#fff;}
  .cat.on .cic{outline:3px solid #FFC93C; outline-offset:2px; transform:scale(1.08);}
  .cat span{font-size:12px;color:#5D4E37;font-weight:600;}
  .keypad{margin-top:20px;background:#FFF3D6;border-radius:24px 24px 0 0;padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .key{
    background:#fff;border:none;border-radius:14px;padding:14px 0;
    font-size:22px;font-weight:700;color:#5D4E37;cursor:pointer;
  }
  .key.action{background:#FFD93D;color:#fff;font-size:16px;}
  .key.zero{grid-column:span 2;}

  /* ===== 统计 ===== */
  .donut-wrap{margin:16px;background:linear-gradient(135deg,#FFE082,#FFD93D);border-radius:24px;padding:20px;position:relative;}
  .donut{width:200px;height:200px;border-radius:50%;margin:0 auto;position:relative;}
  .donut .center{
    position:absolute;inset:25%;background:#FFE082;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .donut .center img{width:80%;height:80%;object-fit:contain;}
  .legend{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:12px;color:#5D4E37;}
  .legend .dot{width:10px;height:10px;border-radius:50%;}
  .stat-card{margin:12px 16px;background:#fff;border-radius:20px;padding:16px;}
  .stat-card h3{font-size:15px;font-weight:800;margin-bottom:12px;}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .rank-row .ric{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .rank-row .ric svg{width:16px;height:16px;fill:#fff;}
  .rank-row .rname{flex:1;font-size:13px;font-weight:600;}
  .rank-row .ramt{font-size:13px;font-weight:700;}
  .bar{height:6px;border-radius:3px;background:#FFF3D6;margin-top:4px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:3px;}

  /* ===== 弹窗 ===== */
  .mask{
    position:absolute;inset:0;background:rgba(93,78,55,.45);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .mask.show{display:flex;animation:fadeIn .2s;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:28px;width:100%;max-width:320px;padding:28px 24px;
    text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .modal img{width:140px;height:140px;object-fit:contain;margin:0 auto 12px;display:block;}
  .modal h2{font-size:22px;font-weight:800;color:#5D4E37;margin-bottom:6px;}
  .modal .sub{font-size:14px;color:#2E8B57;font-weight:700;margin-bottom:4px;}
  .modal .tip{font-size:12px;color:#B8A584;margin-bottom:18px;}
  .modal .btn-y{
    width:100%;background:#FFD93D;color:#fff;border:none;border-radius:999px;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .modal .btn-row{display:flex;gap:10px;margin-top:12px;}
  .modal .btn-g{
    flex:1;background:#fff;border:1.5px solid #FFD93D;color:#8A7450;border-radius:999px;
    padding:12px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .modal .btn-y2{
    flex:1;background:#FFD93D;color:#fff;border:none;border-radius:999px;
    padding:12px;font-size:14px;font-weight:700;cursor:pointer;
  }

  /* 工资横幅 */
  .salary-banner{
    margin:8px 16px;background:linear-gradient(135deg,#FFB6B9,#FFD93D);
    border-radius:20px;padding:14px 16px;display:none;align-items:center;gap:12px;
    animation:slideDown .4s;
  }
  .salary-banner.show{display:flex;}
  @keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .salary-banner img{width:56px;height:56px;object-fit:contain;}
  .salary-banner .txt b{display:block;color:#fff;font-size:16px;}
  .salary-banner .txt span{color:#fff;font-size:13px;opacity:.95;}

  /* 空状态 */
  .empty{padding:30px 20px;text-align:center;}
  .empty img{width:140px;height:140px;object-fit:contain;margin-bottom:12px;}
  .empty h3{font-size:17px;font-weight:800;margin-bottom:6px;}
  .empty p{font-size:13px;color:#B8A584;}

  /* 小测试按钮（演示触发） */
  .demo-bar{
    position:absolute;bottom:96px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:4;
  }
  .demo-bar button{
    background:rgba(255,255,255,.9);border:1px solid #FFD93D;color:#8A7450;
    font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:600;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span style="display:flex;gap:5px;align-items:center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#5D4E37"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"/><rect x="9" y="3" width="3" height="9" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#5D4E37"><path d="M8 10.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM4.5 7.5a5 5 0 017 0l-1.4 1.4a3 3 0 00-4.2 0L4.5 7.5zM2 5a9 9 0 0112 0l-1.4 1.4a7 7 0 00-9.2 0L2 5z"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5" fill="none" stroke="#5D4E37"/><rect x="2" y="2" width="14" height="7" rx="1" fill="#5D4E37"/><rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#5D4E37"/></svg>
    </span>
  </div>

  <div class="views">
    <!-- ============ 视图：首页 ============ -->
    <div class="view active" id="view-home">
      <div class="navbar">
        <button class="icon-btn" onclick="toast('菜单')"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
        <h1>奶龙记账</h1>
        <div style="display:flex;gap:8px;">
          <button class="icon-btn" onclick="simulateSalary()" title="发工资"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93V18h-2v1.93A8.01 8.01 0 014.07 13H6v-2H4.07A8.01 8.01 0 0111 4.07V6h2V4.07A8.01 8.01 0 0119.93 11H18v2h1.93A8.01 8.01 0 0113 19.93z"/></svg></button>
          <button class="icon-btn" onclick="simulateOver()"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 00-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button>
        </div>
      </div>
      <div class="month-switch">
        <button class="arr" onclick="shiftMonth(-1)">‹</button>
        <span class="label" id="monthLabel">2026年9月</span>
        <button class="arr" onclick="shiftMonth(1)">›</button>
      </div>
      <div class="month-sub">本月你还可以花</div>

      <div class="balance-card">
        <img class="milo" src="assets/milo/milo.png" alt="milo">
        <div class="balance-num" id="bal-num">¥5,213.50</div>
        <div class="balance-row">
          <span class="inc">已存 ¥8,500.00</span>
          <span class="exp" id="bal-exp">已花 ¥3,286.50</span>
        </div>
        <div class="heart"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FF8FA3"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      </div>

      <div class="salary-banner" id="salaryBanner">
        <img src="assets/milo/milo-jump.png" alt="jump">
        <div class="txt"><b>工资到账啦！</b><span>+¥8,500.00，奶龙蹦起来了</span></div>
      </div>

      <div class="seg" id="segHome">
        <button class="on" onclick="pickSeg(this)">全部</button>
        <button onclick="pickSeg(this)">支出</button>
        <button onclick="pickSeg(this)">收入</button>
      </div>

      <div class="txn-card" id="txnList"></div>
    </div>

    <!-- ============ 视图：记一笔 ============ -->
    <div class="view" id="view-add">
      <div class="add-head">
        <div class="navbar">
          <button class="icon-btn" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
          <h1>记一笔</h1>
          <button class="icon-btn" onclick="doSave()"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></button>
        </div>
        <div class="type-switch">
          <button class="on">支出</button><button>收入</button><button>转账</button>
        </div>
        <div class="big-amount"><span class="yen">¥</span><span id="amountShow">0</span></div>
        <div class="amount-hint">输入金额</div>
      </div>

      <div class="note">加点备注…</div>

      <div class="cat-grid" id="catGrid"></div>

      <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="del()"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#8A7450;margin:auto;"><path d="M9 5L4 12l5 7h11V5H9zm8 10h-2v-2h2v2zm0-4h-2V9h2v2z"/></svg></button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('.')">.</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key zero" onclick="press('0')">0</button>
        <button class="key action" onclick="doSave()">记好啦</button>
      </div>
    </div>

    <!-- ============ 视图：统计 ============ -->
    <div class="view" id="view-stats">
      <div class="navbar">
        <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
        <h1>奶龙算账</h1>
        <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H5V9h14v10z"/></svg></button>
      </div>
      <div class="seg" style="margin:8px 16px;">
        <button>日</button><button>周</button><button class="on">月</button><button>年</button>
      </div>

      <div class="donut-wrap">
        <div class="donut" id="donut">
          <div class="center"><img src="assets/milo/milo.png" alt="milo"></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="stat-card">
        <h3>花得最多的是…</h3>
        <div id="rankList"></div>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="go('add')"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

  <!-- 底部 Tab -->
  <div class="tabbar">
    <button class="tab on" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z"/></svg><span>首页</span>
    </button>
    <button class="tab" data-tab="stats" onclick="go('stats')">
      <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg><span>统计</span>
    </button>
    <button class="tab center" onclick="go('add')">
      <div class="plus"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
    </button>
    <button class="tab" onclick="toast('账本页 演示中')">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 8h14v-2H7v2zm0-4h14v-2H7v2zm0-6v2h14V7H7z"/></svg><span>账本</span>
    </button>
    <button class="tab" onclick="toast('我的页面 演示中')">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3 0-6 1.5-6 4v2h12v-2c0-2.5-3-4-6-4z"/></svg><span>我的</span>
    </button>
  </div>

  <!-- 预加载弹窗用图（避免发布后裂图） -->
  <img src="assets/milo/milo-happy.png" alt="" style="display:none">
  <img src="assets/milo/milo-sad.png" alt="" style="display:none">
  <img src="assets/milo/milo-innocent.png" alt="" style="display:none">

  <!-- ===== 弹窗 ===== -->
  <div class="mask" id="mask">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- toast -->
  <div id="toast" style="position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(93,78,55,.85);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;"></div>
</div>

<script>
// ===== 数据 =====
const state = {
  balance: 5213.50,
  income: 8500,
  expense: 3286.50,
  current: "",
  category: "午饭",
  txns: [
    {day:"9月26日 今天", items:[
      {icon:"lunch",  color:"#FF8A65", name:"午饭 · 公司楼下黄焖鸡", amt:-32.00},
      {icon:"shop",   color:"#FFC93C", name:"购物 · 超市零食",       amt:-156.80},
      {icon:"bus",    color:"#81C784", name:"交通 · 地铁通勤",       amt:-6.00},
      {icon:"milk",   color:"#F48FB1", name:"摸鱼 · 奶茶续命",       amt:-18.00},
    ]},
    {day:"9月25日 昨天", items:[
      {icon:"salary", color:"#AED581", name:"9月工资到账", amt:8500},
    ]},
  ]
};

const CATS = [
  {key:"lunch",  name:"午饭", color:"#FF8A65"},
  {key:"shop",   name:"购物", color:"#FFC93C"},
  {key:"bus",    name:"通勤", color:"#81C784"},
  {key:"house",  name:"房租", color:"#BA68C8"},
  {key:"milk",   name:"奶茶", color:"#F48FB1"},
  {key:"med",    name:"吃药", color:"#4DD0E1"},
  {key:"snack",  name:"零食", color:"#A1887F"},
  {key:"more",   name:"更多", color:"#BCAAA4"},
];

// 分类图标 SVG path（简单）
const ICON_PATHS = {
  lunch:"M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8h2V2c-2.48 0-4.5 2.02-4.5 4z",
  shop:"M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2h2V8h4v2h2V8h2v12z",
  bus:"M12 2C8 2 4 2.5 4 6v11c0 1.66 1.34 3 3 3h1c1.66 0 3-1.34 3-3v-1h2v1c0 1.66 1.34 3 3 3h1c1.66 0 3-1.34 3-3V6c0-3.5-4-4-8-4zM6.5 7c.83 0 1.5.67 1.5 1.5S7.33 10 6.5 10 5 9.33 5 8.5 5.67 7 6.5 7zm11 0c.83 0 1.5.67 1.5 1.5S18.33 10 17.5 10 16 9.33 16 8.5 16.67 7 17.5 7zM17 14H7v-2h10v2z",
  house:"M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z",
  milk:"M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z",
  med:"M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z",
  snack:"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z",
  more:"M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z",
  salary:"M12 1v9.5C12 12.43 10.43 14 8.5 14S5 12.43 5 11.5V1H3v10.5C3 14.45 5.55 17 8.5 17s5.5-2.55 5.5-5.5V1h-2zM21 8h-7v2h5v7h-5v2h7V8z"
};

// ===== 渲染流水 =====
function renderTxns(){
  const el = document.getElementById('txnList');
  let html = "";
  if(state.txns.length === 0){
    el.innerHTML = `<div class="empty">
      <img src="assets/milo/milo-innocent.png" alt="innocent">
      <h3>今天还没记账哦~</h3>
      <p>点下面的加号，记一笔今天的小花费吧</p>
    </div>`;
    return;
  }
  state.txns.forEach(g=>{
    html += `<div class="day-label">${g.day}</div>`;
    g.items.forEach(it=>{
      const ic = ICON_PATHS[it.icon] || ICON_PATHS.more;
      html += `<div class="txn-row">
        <div class="txn-ic" style="background:${it.color}"><svg viewBox="0 0 24 24"><path d="${ic}"/></svg></div>
        <div class="txn-name">${it.name}</div>
        <div class="txn-amt ${it.amt>0?'inc':''}">${it.amt>0?'+':''}¥${Math.abs(it.amt).toFixed(2)}</div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

// ===== 渲染分类宫格 =====
function renderCats(){
  const el = document.getElementById('catGrid');
  el.innerHTML = CATS.map(c=>`
    <button class="cat ${state.category===c.name?'on':''}" onclick="pickCat('${c.name}')">
      <div class="cic" style="background:${c.color}"><svg viewBox="0 0 24 24"><path d="${ICON_PATHS[c.key]}"/></svg></div>
      <span>${c.name}</span>
    </button>`).join('');
}
function pickCat(n){ state.category=n; renderCats(); }

// ===== 键盘 =====
function press(k){
  if(state.current.replace('.','').length>=7) return;
  if(k==='.' && state.current.includes('.')) return;
  state.current += k;
  document.getElementById('amountShow').textContent = state.current || '0';
}
function del(){ state.current = state.current.slice(0,-1); document.getElementById('amountShow').textContent = state.current || '0'; }

// ===== 保存 =====
function doSave(){
  const amt = parseFloat(state.current);
  if(!amt || amt<=0){ toast('先输个金额嘛~'); return; }
  state.expense += amt;
  state.balance -= amt;
  state.txns[0].items.unshift({icon:'lunch',color:'#FF8A65',name:state.category+' · 随手记',amt:-amt});
  document.getElementById('bal-num').textContent = '¥'+state.balance.toFixed(2);
  document.getElementById('bal-exp').textContent = '已花 ¥'+state.expense.toFixed(2);
  state.current='';
  document.getElementById('amountShow').textContent='0';
  renderTxns();
  openModal('success', amt);
}

// ===== 弹窗 =====
function openModal(type, amt){
  const box = document.getElementById('modalBox');
  if(type==='success'){
    box.innerHTML = `
      <img src="assets/milo/milo-happy.png" alt="happy">
      <h2>记好啦！</h2>
      <div class="sub">-¥${amt.toFixed(2)} ${state.category}</div>
      <div class="tip">这笔账已经帮你存好啦~</div>
      <button class="btn-y" onclick="closeModal();go('home')">开心回家</button>`;
  } else if(type==='over'){
    box.innerHTML = `
      <img src="assets/milo/milo-sad.png" alt="sad">
      <h2>哎呀，这个月要吃土咯…</h2>
      <div class="tip" style="margin-top:8px">这个月花超啦，要不咱省着点花？</div>
      <div class="btn-row">
        <button class="btn-g" onclick="closeModal()">以后再说</button>
        <button class="btn-y2" onclick="closeModal();go('stats')">去看看账单</button>
      </div>`;
  }
  document.getElementById('mask').classList.add('show');
}
function closeModal(){ document.getElementById('mask').classList.remove('show'); }

// ===== 视图切换 =====
function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  const tb = document.querySelector(`.tab[data-tab="${v}"]`);
  if(tb) tb.classList.add('on');
  closeModal();
}

// ===== 演示触发 =====
function simulateSalary(){
  const b = document.getElementById('salaryBanner');
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 3500);
}
function simulateOver(){ openModal('over'); }

// ===== 统计：环形图 =====
function renderDonut(){
  const data = [
    {n:'午饭', v:1240, c:'#FF8A65'},
    {n:'购物', v:680,  c:'#FFC93C'},
    {n:'房租', v:560,  c:'#BA68C8'},
    {n:'通勤', v:420,  c:'#81C784'},
    {n:'奶茶', v:386,  c:'#F48FB1'},
  ];
  const total = data.reduce((s,d)=>s+d.v,0);
  let acc = 0;
  const stops = data.map(d=>{
    const start = acc/total*100;
    acc += d.v;
    const end = acc/total*100;
    return `${d.c} ${start}% ${end}%`;
  }).join(',');
  document.getElementById('donut').style.background = `conic-gradient(${stops})`;
  document.getElementById('legend').innerHTML = data.map(d=>
    `<div class="li"><span class="dot" style="background:${d.c}"></span>${d.n} ${(d.v/total*100).toFixed(0)}%</div>`
  ).join('');
  document.getElementById('rankList').innerHTML = data.map(d=>`
    <div class="rank-row">
      <div class="ric" style="background:${d.c}"><svg viewBox="0 0 24 24"><path d="${ICON_PATHS[d.n==='午饭'?'lunch':d.n==='购物'?'shop':d.n==='通勤'?'bus':d.n==='奶茶'?'milk':'house']}"/></svg></div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between">
          <span class="rname">${d.n}</span><span class="ramt">¥${d.v}</span>
        </div>
        <div class="bar"><i style="width:${(d.v/total*100).toFixed(0)}%;background:${d.c}"></i></div>
      </div>
    </div>`).join('');
}

// ===== 演示用小交互 =====
let monthOffset = 0;
function shiftMonth(d){
  monthOffset += d;
  const base = new Date(2026, 8, 1); // 2026-09
  base.setMonth(base.getMonth()+monthOffset);
  document.getElementById('monthLabel').textContent =
    base.getFullYear()+'年'+(base.getMonth()+1)+'月';
}
function pickSeg(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.style.opacity='0', 1500);
}

// ===== init =====
renderTxns();
renderCats();
renderDonut();
</script>
</body>
</html>
