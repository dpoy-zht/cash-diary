<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>形象中心 · 奶龙主题</title>
<style>
  /* ==========================================================================
     设计令牌：与 src/App.vue 保持同一套（改配色请两边同步）
     规范见 docs/nailong-ui-spec.md
     ========================================================================== */
  :root {
    --cd-bg: #fff8e7;
    --cd-surface: #ffffff;
    --cd-cream: #fff3d6;
    --cd-cream-2: #fffaee;
    --cd-primary: #ffd34d;
    --cd-primary-lt: #fff0be;
    --cd-primary-dk: #f0a500;
    --cd-grad-brand: linear-gradient(180deg, #ffe98f 0%, #ffc93c 100%);
    --cd-ink: #4a3520;
    --cd-ink-2: #7e6849;
    --cd-ink-3: #b9a88f;
    --cd-line: #f2e6ce;
    --cd-danger-ink: #b93b39;
    --cd-r-pill: 999px;
    --cd-r-lg: 28px;
    --cd-r-md: 20px;
    --cd-r-sm: 16px;
    --cd-sh-1: 0 2px 10px rgba(191, 149, 42, 0.12);
    --cd-sh-2: 0 8px 26px rgba(191, 149, 42, 0.20);
    --cd-dur: 180ms;
    --cd-ease: cubic-bezier(0.34, 1.35, 0.64, 1);
    --cd-font: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC",
      system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--cd-font);
    color: var(--cd-ink);
    background: #e8dfcd;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    position: relative;
    width: 100%; max-width: 430px; min-height: 100dvh;
    background: var(--cd-bg);
    display: flex; flex-direction: column;
    box-shadow: 0 18px 60px rgba(122, 95, 30, 0.22);
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  .app-bar {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px 14px; background: var(--cd-primary);
  }
  .bar-title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .bar-tag {
    font-size: 11px; font-weight: 600; color: var(--cd-ink);
    background: rgba(255, 255, 255, 0.6); padding: 4px 10px; border-radius: var(--cd-r-pill);
  }

  main { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .section { padding: 0 20px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 22px 0 10px;
  }
  .section-head h2 { font-size: 15px; font-weight: 700; }
  .section-count { font-size: 12px; color: var(--cd-ink-2); }

  /* ---------- Hero 当前形象 ---------- */
  .hero {
    margin: 16px 20px 0;
    background: var(--cd-surface);
    border-radius: var(--cd-r-lg);
    box-shadow: var(--cd-sh-1);
    overflow: hidden;
  }
  .hero-media {
    position: relative;
    height: 236px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, #fff6d8 0%, #fffdf7 72%);
  }
  /* 角色身后的柔光圆，让透明底素材不显"飘" */
  .hero-glow {
    position: absolute; width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 211, 77, 0.45) 0%, rgba(255, 211, 77, 0) 70%);
  }
  .hero-media img {
    position: relative;
    max-width: 80%; max-height: 200px; width: auto; height: auto;
    object-fit: contain; display: block;
    opacity: 0; transform: translateY(6px) scale(0.98);
    transition: opacity 260ms ease, transform 320ms var(--cd-ease);
  }
  /* 白底角色图已在 fetch.py 里抠成透明（透明通道），可直接叠在任何底色上 */
  .hero-media.is-poster .hero-glow { display: none; }
  .hero-media.is-loaded img { opacity: 1; transform: none; }

  .hero-meta { padding: 14px 20px 18px; border-top: 1px solid var(--cd-line); }
  .hero-row { display: flex; align-items: center; gap: 8px; }
  .hero-name { font-size: 17px; font-weight: 700; }
  .hero-badge {
    font-size: 11px; font-weight: 700; color: #8a5a0f;
    background: var(--cd-primary-lt); padding: 3px 9px; border-radius: var(--cd-r-pill);
  }
  .hero-desc { margin-top: 5px; font-size: 13px; line-height: 1.6; color: var(--cd-ink-2); }

  /* ---------- 骨架屏 / 失败占位（图片加载的三种状态） ---------- */
  /* 半透明白色微光：在浅奶黄与天蓝海报上都成立，不挑底色 */
  .skel {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0.3) 30%, rgba(255, 255, 255, 0.78) 50%, rgba(255, 255, 255, 0.3) 70%);
    background-size: 220% 100%;
    animation: skel 1.25s ease-in-out infinite;
  }
  @keyframes skel { from { background-position: 140% 0; } to { background-position: -40% 0; } }
  .is-loaded .skel, .is-error .skel { display: none; }

  .fallback {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 12px;
    background: var(--cd-cream-2);
  }
  .is-error .fallback { display: flex; }
  .fallback .fb-title { font-size: 12px; font-weight: 600; color: var(--cd-ink-2); }
  .fallback .fb-hint { font-size: 11px; line-height: 1.5; color: var(--cd-ink-3); }

  /* ---------- 形象网格 ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .tile {
    position: relative; font-family: inherit; text-align: left; cursor: pointer;
    border: 0; padding: 0; overflow: hidden;
    background: var(--cd-surface);
    border-radius: var(--cd-r-md);
    box-shadow: var(--cd-sh-1);
    transition: transform var(--cd-dur) var(--cd-ease), box-shadow var(--cd-dur) var(--cd-ease);
  }
  .tile:active { transform: scale(0.975); }
  .tile:focus-visible { outline: 3px solid var(--cd-primary-dk); outline-offset: 2px; }
  .tile-media {
    position: relative; aspect-ratio: 3 / 4; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-media img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; display: block;
    opacity: 0; transform: scale(0.96);
    transition: opacity 240ms ease, transform 280ms var(--cd-ease);
  }
  /* 抠透明后的角色图：留白 + 柔和底色，像贴纸贴在卡片上 */
  .tile-media.is-cutout { padding: 12px; }
  /* 满幅海报：海报本身即 3:4，与卡片同比，contain 等价于满铺且不裁切 */
  .tile-media.is-poster { padding: 0; }
  .tile-media.is-loaded img { opacity: 1; transform: none; }
  .tile-label {
    display: block; padding: 0 12px 12px;
    font-size: 12px; font-weight: 600; color: var(--cd-ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 选中态：金环 + 右上角勾选；用 box-shadow 画环，不改变盒子尺寸 */
  .tile[aria-pressed="true"] {
    box-shadow: 0 0 0 2.5px var(--cd-primary-dk), var(--cd-sh-2);
  }
  .tile[aria-pressed="true"] .tile-label { color: var(--cd-ink); }
  .tile-check {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--cd-primary-dk); color: #fff;
    font-size: 13px; font-weight: 700; line-height: 22px; text-align: center;
    opacity: 0; transform: scale(0.5); transition: opacity var(--cd-dur), transform var(--cd-dur) var(--cd-ease);
  }
  .tile[aria-pressed="true"] .tile-check { opacity: 1; transform: none; }
  /* 已应用的形象：左下角小标签，和"选中"区分开 */
  .tile-applied {
    position: absolute; left: 8px; bottom: 40px;
    font-size: 10px; font-weight: 700; color: #8a5a0f;
    background: rgba(255, 240, 190, 0.94); padding: 2px 8px; border-radius: var(--cd-r-pill);
    opacity: 0; transition: opacity var(--cd-dur);
  }
  .tile.is-applied .tile-applied { opacity: 1; }

  /* ---------- 文字按钮（第三级操作） ---------- */
  .link-btn {
    display: block; margin: 16px auto 0; border: 0; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--cd-ink-2);
    padding: 10px 16px; border-radius: var(--cd-r-pill); cursor: pointer;
  }
  .link-btn:active { background: var(--cd-cream); }
  .link-btn:focus-visible { outline: 3px solid var(--cd-primary-dk); outline-offset: 2px; }

  /* ---------- 素材说明 ---------- */
  .notice {
    margin: 22px 20px 24px; padding: 14px 16px;
    background: var(--cd-cream-2); border-radius: var(--cd-r-md);
    border: 1px solid var(--cd-line);
  }
  .notice h3 { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .notice p { font-size: 11px; line-height: 1.75; color: var(--cd-ink-2); }
  .notice code {
    font-family: ui-monospace, Consolas, monospace; font-size: 10px;
    background: var(--cd-cream); padding: 1px 5px; border-radius: 5px;
  }

  /* ---------- 底部固定操作栏 ---------- */
  .actionbar {
    position: relative; z-index: 1; /* 明确压在灯箱之下 */
    flex: none; display: flex; gap: 10px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255, 253, 247, 0.94);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--cd-line);
  }
  .btn {
    font-family: inherit; font-weight: 700; border: 0; cursor: pointer;
    height: 50px; border-radius: var(--cd-r-md);
    transition: transform var(--cd-dur) var(--cd-ease), opacity var(--cd-dur), box-shadow var(--cd-dur);
  }
  .btn:focus-visible { outline: 3px solid var(--cd-primary-dk); outline-offset: 2px; }
  .btn:active { transform: scale(0.98); }
  .btn--primary {
    flex: 2; font-size: 16px; color: var(--cd-ink);
    background: var(--cd-grad-brand); box-shadow: 0 4px 14px rgba(240, 165, 0, 0.3);
  }
  .btn--secondary {
    flex: 1; font-size: 14px; color: var(--cd-ink);
    background: var(--cd-surface); box-shadow: var(--cd-sh-1);
  }
  .btn[disabled] { cursor: not-allowed; opacity: 0.55; }
  .btn--primary[disabled] { background: var(--cd-cream); box-shadow: none; color: var(--cd-ink-3); }
  .btn--primary.is-done { background: #e8f8f0; color: #1f7a55; box-shadow: none; }

  /* ---------- 灯箱（大图预览） ---------- */
  .lightbox {
    position: absolute; inset: 0; z-index: 60;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lb-backdrop { position: absolute; inset: 0; background: rgba(38, 26, 12, 0.9); }
  .lb-stage {
    position: relative; margin: auto; width: 100%; height: 62%;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-stage img {
    max-width: 84%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; border-radius: var(--cd-r-md);
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
    transition: opacity 220ms ease;
  }
  .lb-stage.is-loading img { opacity: 0.45; }
  .lb-spinner {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.28); border-top-color: #fff;
    animation: spin 720ms linear infinite; opacity: 0; transition: opacity 150ms;
  }
  .lb-stage.is-loading .lb-spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .lb-caption {
    position: relative; text-align: center; color: #fff;
    font-size: 14px; font-weight: 600; padding: 0 60px;
  }
  .lb-counter { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: rgba(255, 255, 255, 0.66); }
  .lb-dots {
    position: relative; display: flex; justify-content: center; gap: 6px;
    padding: 14px 0 calc(28px + env(safe-area-inset-bottom));
  }
  .lb-dot {
    width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(255, 255, 255, 0.34); transition: all var(--cd-dur);
  }
  .lb-dot[aria-current="true"] { width: 18px; border-radius: var(--cd-r-pill); background: var(--cd-primary); }

  .lb-icon {
    position: absolute; z-index: 2; border: 0; cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.16); color: #fff;
    font-size: 20px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--cd-dur), transform var(--cd-dur) var(--cd-ease);
  }
  .lb-icon:hover { background: rgba(255, 255, 255, 0.28); }
  .lb-icon:active { transform: scale(0.92); }
  .lb-icon:focus-visible { outline: 3px solid var(--cd-primary); outline-offset: 2px; }
  .lb-close { top: 16px; right: 16px; font-size: 16px; }
  .lb-prev { left: 14px; top: 50%; margin-top: -22px; }
  .lb-next { right: 14px; top: 50%; margin-top: -22px; }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(8px);
    background: rgba(61, 42, 23, 0.9); color: #fff; font-size: 13px;
    padding: 10px 20px; border-radius: var(--cd-r-pill); white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms var(--cd-ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-bar">
    <div class="bar-title">形象中心</div>
    <span class="bar-tag">奶龙主题</span>
  </header>

  <main>
    <!-- 当前形象 -->
    <section class="hero" aria-live="polite">
      <div class="hero-media" id="heroMedia">
        <div class="hero-glow"></div>
        <div class="skel"></div>
        <div class="fallback">
          <span class="fb-title">素材未就绪</span>
          <span class="fb-hint">请先运行 fetch.py 获取图片素材</span>
        </div>
      </div>
      <div class="hero-meta">
        <div class="hero-row">
          <span class="hero-name" id="heroName">加载中…</span>
          <span class="hero-badge" id="heroBadge" hidden>使用中</span>
        </div>
        <p class="hero-desc" id="heroDesc"></p>
      </div>
    </section>

    <!-- 形象网格 -->
    <section class="section">
      <div class="section-head">
        <h2>选一个形象</h2>
        <span class="section-count" id="gridCount"></span>
      </div>
      <div class="grid" id="grid" role="group" aria-label="奶龙形象列表"></div>
      <button class="link-btn" id="btnReset">恢复默认形象</button>
    </section>

    <section class="notice">
      <h3>素材说明</h3>
      <p>
        「奶龙」形象版权归 <strong>第七印象文化传媒（深圳）有限公司</strong> 所有。
        本页图片取自萌娘共享（commons.moegirl.org.cn），<strong>仅供本机原型验证与个人学习使用，不得商用、不得公开发布或再分发</strong>。
        图片已转为 WebP 并按用途分两档尺寸；素材不随仓库分发，运行 <code>python fetch.py</code> 可重新获取。
      </p>
    </section>
  </main>

  <!-- 固定操作栏：主 / 次两级按钮 -->
  <footer class="actionbar">
    <button class="btn btn--secondary" id="btnPreview">查看大图</button>
    <button class="btn btn--primary" id="btnApply">设为我的形象</button>
  </footer>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="大图预览">
    <div class="lb-backdrop" data-close></div>
    <button class="lb-icon lb-close" data-close aria-label="关闭预览">✕</button>
    <button class="lb-icon lb-prev" id="lbPrev" aria-label="上一个">‹</button>
    <button class="lb-icon lb-next" id="lbNext" aria-label="下一个">›</button>

    <figure class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
      <div class="lb-spinner"></div>
    </figure>
    <figcaption class="lb-caption">
      <span id="lbCaption"></span>
      <span class="lb-counter" id="lbCounter"></span>
    </figcaption>
    <div class="lb-dots" id="lbDots"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/* ============================================================================
   形象中心 · 交互说明
   ----------------------------------------------------------------------------
   数据流（单向，UI 只由 state 渲染出来）：
     state.selected  ← 点网格卡片 / 灯箱左右切换
     state.applied   ← 「设为我的形象」（持久化到 localStorage）
     「查看大图」永远预览 state.selected，所以它不会出现"我点的是哪张"的歧义。

   图片加载策略（保证顺畅）：
     1) 网格只用 <slug>-thumb.webp（单张约 5–24KB），并 lazy + async 解码；
     2) 先挂骨架屏，onload 后淡入，避免白块与跳动；
     3) 失败时显示占位 + 提示，而不是破图；
     4) 灯箱先用已缓存的缩略图秒出，再后台加载大图，加载完成后淡入替换。
   ========================================================================== */

var ASSETS = 'assets/nailong/';

/* 形象清单：data 驱动，替换/新增形象只改这里。
   两处关键字段：
     mode: 'cutout' 白底角色图 → contain + mix-blend-mode:multiply，让白底融进卡片色
           'poster' 满幅彩底海报 → contain（海报本身即 3:4，与卡片同比，等于满铺）
     bg:   边缘色。poster 用它做画框底色，画面与底色无缝衔接；cutout 用柔和底色 tint */
var ITEMS = [
  { slug: 'nailong-1',      name: '奶龙 · 正面',   mode: 'cutout', tint: '#fff0be',
    desc: '最经典的一张。圆脑袋 + 两朵红晕，适合当默认形象。' },
  { slug: 'nailong-2',      name: '奶龙 · 招手',   mode: 'cutout', tint: '#e6f6ff',
    desc: '抬爪打招呼，配「该记账啦」这类提示文案刚好。' },
  { slug: 'nailong-xiaoqi', name: '奶龙与小七',    mode: 'poster', bg: '#79bae5',
    desc: '奶龙和好朋友同框，热闹一点，适合当皮肤封面。' },
  { slug: 'xiaoxi-nailong', name: '小七与奶龙',    mode: 'cutout', tint: '#e8f8f0',
    desc: '竖构图，人物比例偏细长，放在列表里更显轻巧。' },
  { slug: 'carnival-1',     name: '爆笑嘉年华',    mode: 'poster', bg: '#52bad7',
    desc: '剧场版海报，色彩最饱满，醒目但信息量也最多。' },
  { slug: 'carnival-2',     name: '爆笑嘉年华 II', mode: 'poster', bg: '#34befd',
    desc: '同系列第二张，构图更聚焦在角色身上。' },
  { slug: 'mischief',       name: '搞怪大作战',    mode: 'poster', bg: '#8ac8e8',
    desc: '表情最夸张的一张，适合做「超支提醒」的形象。' },
  { slug: 'vs-baobaolong',  name: '大战暴暴龙',    mode: 'poster', bg: '#0892ec',
    desc: '对抗感强，动作张力大，用在对峙类场景。' },
  { slug: 'baobaolong',     name: '暴暴龙',        mode: 'cutout', tint: '#ffedf0',
    desc: '反派角色。风格与主角差异明显，可作对照选择。' }
];

var LS_KEY = 'cashDiary.theme.character';
var DEFAULT_SLUG = ITEMS[0].slug;

var state = {
  selected: DEFAULT_SLUG,
  applied: null
};

/* ---------- 工具 ---------- */
function $(id) { return document.getElementById(id); }
function idxOf(slug) {
  for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].slug === slug) return i;
  return 0;
}
function itemOf(slug) { return ITEMS[idxOf(slug)]; }

var toastTimer = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = 'toast'; }, 1700);
}

function loadApplied() {
  try {
    var v = localStorage.getItem(LS_KEY);
    if (v && ITEMS.some(function (it) { return it.slug === v; })) return v;
  } catch (e) { /* 无 localStorage 时忽略 */ }
  return null;
}
function saveApplied(slug) {
  try { localStorage.setItem(LS_KEY, slug); } catch (e) { /* 忽略 */ }
}
function clearApplied() {
  try { localStorage.removeItem(LS_KEY); } catch (e) { /* 忽略 */ }
}

/**
 * 统一的图片装载：骨架 → 淡入 / 或失败占位。
 * box 需要带有 .skel 与 .fallback 两个子元素。
 */
function mountImage(box, src, alt, imgClass) {
  var old = box.querySelector('img');
  if (old) old.remove();
  box.classList.remove('is-loaded', 'is-error');

  var img = document.createElement('img');
  if (imgClass) img.className = imgClass;
  img.alt = alt;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.onload = function () { box.classList.add('is-loaded'); };
  img.onerror = function () { box.classList.add('is-error'); };
  img.src = src;
  box.appendChild(img);
  return img;
}

/* ---------- 渲染 ---------- */
function renderHero() {
  var it = itemOf(state.selected);
  var box = $('heroMedia');
  box.classList.remove('is-loaded', 'is-error');
  box.classList.toggle('is-cutout', it.mode === 'cutout');
  box.classList.toggle('is-poster', it.mode === 'poster');
  // 海报用自身边缘色做画框底（无缝）；白底角色图走 CSS 的奶油渐变 + multiply
  box.style.background = it.mode === 'poster' ? it.bg : '';
  mountImage(box, ASSETS + it.slug + '-full.webp', it.name + ' 预览', 'media-img');
  $('heroName').textContent = it.name;
  $('heroDesc').textContent = it.desc;
  $('heroBadge').hidden = state.applied !== it.slug;
  renderActions();
}

function renderGrid() {
  var grid = $('grid');
  grid.innerHTML = '';
  ITEMS.forEach(function (it) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.setAttribute('aria-pressed', String(it.slug === state.selected));
    btn.setAttribute('aria-label', it.name);
    btn.dataset.slug = it.slug;
    btn.innerHTML =
      '<div class="tile-media">' +
        '<div class="skel"></div>' +
        '<div class="fallback">' +
          '<span class="fb-title">图片未加载</span>' +
          '<span class="fb-hint">运行 fetch.py 获取素材</span>' +
        '</div>' +
      '</div>' +
      '<span class="tile-check" aria-hidden="true">✓</span>' +
      '<span class="tile-applied">使用中</span>' +
      '<span class="tile-label">' + it.name + '</span>';

    var media = btn.querySelector('.tile-media');
    media.classList.toggle('is-cutout', it.mode === 'cutout');
    media.classList.toggle('is-poster', it.mode === 'poster');
    media.style.background = it.mode === 'poster' ? it.bg : it.tint;
    mountImage(media, ASSETS + it.slug + '-thumb.webp', it.name, 'media-img');

    if (it.slug === state.applied) btn.classList.add('is-applied');
    btn.addEventListener('click', function () { select(it.slug); });
    grid.appendChild(btn);
  });

  $('gridCount').textContent = '共 ' + ITEMS.length + ' 款';
}

function renderActions() {
  var apply = $('btnApply');
  var isApplied = state.applied === state.selected;
  apply.disabled = isApplied;
  apply.classList.toggle('is-done', isApplied);
  apply.textContent = isApplied ? '✓ 已应用' : '设为我的形象';
}

/* 只更新选中态，避免整表重绘（保留已加载的图片，交互才跟手） */
function syncSelection() {
  var tiles = $('grid').querySelectorAll('.tile');
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    t.setAttribute('aria-pressed', String(t.dataset.slug === state.selected));
    t.classList.toggle('is-applied', t.dataset.slug === state.applied);
  }
  renderHero();
}

/* ---------- 交互 ---------- */
function select(slug) {
  if (state.selected === slug) return;
  state.selected = slug;
  syncSelection();
}

function applySelected() {
  state.applied = state.selected;
  saveApplied(state.applied);
  syncSelection();
  toast('已应用「' + itemOf(state.applied).name + '」');
}

function resetToDefault() {
  clearApplied();
  state.applied = null;
  state.selected = DEFAULT_SLUG;
  syncSelection();
  toast('已恢复默认形象');
}

/* ---------- 灯箱 ---------- */
var lbIndex = 0;
var lbSeq = 0; // 防止快速切换时旧的大图回调覆盖新的

function openLightbox(slug) {
  lbIndex = idxOf(slug);
  $('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
  renderLightbox();
}
function closeLightbox() {
  $('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}
function stepLightbox(delta) {
  lbIndex = (lbIndex + delta + ITEMS.length) % ITEMS.length;
  renderLightbox();
}

function renderLightbox() {
  var it = ITEMS[lbIndex];
  var img = $('lbImg');
  var stage = $('lbStage');

  // 1) 缩略图已经缓存过，先秒出，避免开灯箱时黑屏
  img.src = ASSETS + it.slug + '-thumb.webp';
  img.alt = it.name;
  // 深色背景上给图片一个底色，白底素材才不像"白纸片"
  img.style.background = it.mode === 'poster' ? it.bg : '#ffffff';
  $('lbCaption').textContent = it.name;
  $('lbCounter').textContent = (lbIndex + 1) + ' / ' + ITEMS.length;
  renderDots();

  // 2) 后台加载大图，好了再淡入替换
  var seq = ++lbSeq;
  stage.classList.add('is-loading');
  var full = new Image();
  full.onload = function () {
    if (seq !== lbSeq) return;
    img.src = ASSETS + it.slug + '-full.webp';
    stage.classList.remove('is-loading');
  };
  full.onerror = function () {
    if (seq !== lbSeq) return;
    stage.classList.remove('is-loading');
    toast('大图加载失败，已显示缩略图');
  };
  full.src = ASSETS + it.slug + '-full.webp';
}

function renderDots() {
  var box = $('lbDots');
  box.innerHTML = '';
  ITEMS.forEach(function (it, i) {
    var d = document.createElement('button');
    d.type = 'button';
    d.className = 'lb-dot';
    d.setAttribute('aria-current', String(i === lbIndex));
    d.setAttribute('aria-label', '查看 ' + it.name);
    d.addEventListener('click', function () { lbIndex = i; renderLightbox(); });
    box.appendChild(d);
  });
}

/* ---------- 事件绑定 ---------- */
$('btnApply').addEventListener('click', applySelected);
$('btnPreview').addEventListener('click', function () { openLightbox(state.selected); });
$('btnReset').addEventListener('click', resetToDefault);
$('lbPrev').addEventListener('click', function () { stepLightbox(-1); });
$('lbNext').addEventListener('click', function () { stepLightbox(1); });
$('lightbox').addEventListener('click', function (e) {
  if (e.target.hasAttribute('data-close')) closeLightbox();
});
document.addEventListener('keydown', function (e) {
  if (!$('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') stepLightbox(-1);
  else if (e.key === 'ArrowRight') stepLightbox(1);
});
/* 左右滑动切图（触屏） */
(function () {
  var startX = null;
  var lb = $('lightbox');
  lb.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 45) stepLightbox(dx < 0 ? 1 : -1);
  });
})();

/* ---------- 启动 ---------- */
state.applied = loadApplied();
state.selected = state.applied || DEFAULT_SLUG;
renderGrid();
renderHero();
</script>
</body>
</html>
