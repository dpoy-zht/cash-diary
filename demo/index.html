<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>现金日记 · 交互演示原型</title>
<style>
  /* ======================================================================
     设计令牌（奶龙风：暖黄治愈系）
     与 src/App.vue 的令牌层保持逐字一致——改配色请两边同时改。
     规范说明见 docs/nailong-ui-spec.md
     ====================================================================== */
  :root {
    /* ============================================================
       设计令牌：与 src/App.vue 逐条对齐（马卡龙奶油风）
       改配色请两边同步 —— 本文件是记账 App 的 UX/视觉基准原型
       ============================================================ */

    /* 马卡龙色板（完整 7 色见 docs/nailong-ui-spec.md §12） */
    --cd-cream-yellow: #ffe4a0;
    --cd-peach: #ffd4b3;
    --cd-cream-white: #fffdf7;
    --cd-mint: #b8f0d8;
    --cd-sakura: #ffd1dc;
    --cd-sky: #b8e4f0;
    --cd-lavender: #e8d5f2;
    --cd-white: #ffffff;

    /* 页面背景：三段多色渐变（= 参考项目 --bg-page） */
    --cd-bg: linear-gradient(180deg, #fff9e8 0%, #fff0f5 40%, #e8f5f0 100%);
    --cd-bg-end: #e8f5f0;

    /* 文字 */
    --cd-ink: #5a4a3a;
    --cd-ink-2: #6b5d4f;
    --cd-ink-3: #a89a88;
    --cd-accent-ink: #8a5a22;

    /* 玻璃材质 */
    --cd-card: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.82) 0%,
      rgba(255, 255, 255, 0.7) 50%,
      rgba(255, 253, 250, 0.74) 100%
    );
    --cd-glass: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.66) 0%,
      rgba(255, 252, 245, 0.5) 100%
    );
    --cd-card-line: rgba(255, 255, 255, 0.6);

    /* 多层阴影系统 */
    --cd-sh-contact: 0 1px 2px rgba(139, 119, 99, 0.06);
    --cd-sh-mid: 0 4px 12px rgba(139, 119, 99, 0.1);
    --cd-sh-far: 0 12px 32px rgba(139, 119, 99, 0.14);
    --cd-sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 2px rgba(139, 119, 99, 0.04);
    --cd-card-shadow: var(--cd-sh-contact), var(--cd-sh-mid), var(--cd-sh-far),
      var(--cd-sh-inset);
    --cd-btn-shadow: 0 3px 10px rgba(240, 184, 96, 0.3),
      0 1px 4px rgba(240, 184, 96, 0.18);

    /* 圆角 */
    --cd-r-pill: 999px;
    --cd-r-sm: 16px;
    --cd-r-md: 24px;
    --cd-r-lg: 32px;
    --cd-r-xl: 40px;

    /* 动效曲线 */
    --cd-dur: 220ms;
    --cd-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
    --cd-ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    --cd-ease-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);

    /* 品牌渐变 */
    --cd-grad-brand: linear-gradient(135deg, #ffe4a0 0%, #ffd4b3 100%);

    /* 语义色（PRD §8 冻结） */
    --cd-expense: #e24b4a;
    --cd-income: #12924f;
    --cd-danger-ink: #b93b39;

    /* 分隔 */
    --cd-line-ink: rgba(139, 119, 99, 0.14);

    /* 吸顶导航 */
    --cd-nav-h: 44px;
    --cd-nav-solid: linear-gradient(135deg, #ffe4a0 0%, #ffd4b3 100%);
    --cd-nav-bg: linear-gradient(
      135deg,
      rgba(255, 228, 160, 0.84) 0%,
      rgba(255, 212, 179, 0.84) 100%
    );
    --cd-nav-ink: #5a4a3a;

    /* 吉祥物 */
    --cd-face-head: linear-gradient(180deg, #fff0c2 0%, #ffe4a0 55%, #ffd08a 100%);
    --cd-face-tuft: #f0b860;
    --cd-face-ink: #5a4a3a;
    --cd-face-mouth: #c2504c;
    --cd-face-glint: #fffdf7;
    --cd-blush: #ffb0c0;

    /* 字体 */
    --cd-font: "Nunito", "Varela Round", "MiSans", "HarmonyOS Sans SC",
      "PingFang SC", "Noto Sans SC", system-ui, -apple-system, "Segoe UI",
      Roboto, sans-serif;

    /* ---- 兼容映射：改造前的老令牌名 ----
       原型里有 25 处旧引用，这里把它们指向新色板，避免逐条改；
       新写样式请直接用上面的新令牌。 */
    --cd-surface: rgba(255, 255, 255, 0.78);
    --cd-cream: rgba(255, 228, 160, 0.5);
    --cd-cream-2: rgba(255, 255, 255, 0.55);
    --cd-primary: #ffe4a0;
    --cd-primary-lt: rgba(255, 228, 160, 0.62);
    --cd-primary-dk: #e8a94d;
    --cd-sh-1: var(--cd-sh-contact), var(--cd-sh-mid);
    --cd-sh-2: var(--cd-sh-contact), var(--cd-sh-mid), var(--cd-sh-far);
    --cd-line: rgba(255, 255, 255, 0.75);
    --cd-danger-lt: #fdeceb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--cd-font);
    background: #e8dfcd;
    display: flex; justify-content: center; align-items: center;
    color: var(--cd-ink);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 100%; max-width: 400px; height: 92vh;
    background: var(--cd-bg); display: flex; flex-direction: column;
    border-radius: 32px; overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(122, 95, 30, 0.28);
  }
  @media (max-width: 480px) {
    body { align-items: stretch; }
    .phone { max-width: none; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* 顶栏：品牌黄，对应真机的 navigationBar */
  .app-header {
    height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--cd-nav-solid);
    border-radius: 0 0 var(--cd-r-lg) var(--cd-r-lg);
    box-shadow: var(--cd-sh-contact), var(--cd-sh-mid);
  }
  .app-title { font-size: 17px; font-weight: 700; }
  .demo-tag {
    font-size: 11px; font-weight: 600; color: var(--cd-ink);
    background: rgba(255, 255, 255, 0.55); padding: 4px 10px; border-radius: var(--cd-r-pill);
  }

  /* 页面容器 */
  main { flex: 1; overflow-y: auto; position: relative; }
  .page { display: none; padding-bottom: 16px; }
  .page.active { display: block; }

  /* ===== 吉祥物「小记龙」：纯 CSS，与 src/components/mascot/mascot.vue 同构 ===== */
  .mascot { display: inline-block; position: relative; width: 1em; height: 1em; flex: none; }
  .m-tuft {
    position: absolute; left: 40%; top: 0; width: 9%; height: 14%;
    background: var(--cd-primary-dk); border-radius: 999px 999px 0 0;
    transform: rotate(-18deg); transform-origin: bottom center;
  }
  .m-head {
    position: absolute; left: 0; right: 0; top: 7%; height: 93%;
    border-radius: 50% 50% 46% 46%;
    background: linear-gradient(180deg, #ffe98f 0%, #ffd34d 55%, #f9c02f 100%);
    box-shadow: inset 0 0.05em 0.08em rgba(255, 255, 255, 0.55),
      inset 0 -0.07em 0 rgba(240, 165, 0, 0.28), 0 0.05em 0.12em rgba(191, 149, 42, 0.25);
  }
  .m-eye {
    position: absolute; top: 34%; width: 18%; height: 22%;
    background: var(--cd-face-ink); border-radius: 50%;
    transform-origin: center center; transition: transform .25s;
  }
  .m-eye--l { left: 21%; }
  .m-eye--r { left: 58%; }
  .m-glint {
    position: absolute; left: 14%; top: 14%; width: 32%; height: 30%;
    background: var(--cd-surface); border-radius: 50%;
  }
  .m-cheek {
    position: absolute; top: 56%; width: 19%; height: 13%;
    background: var(--cd-blush); border-radius: 50%; opacity: 0.68;
  }
  .m-cheek--l { left: 16%; }
  .m-cheek--r { left: 64%; }
  .m-mouth {
    position: absolute; left: 41.5%; top: 60%; width: 17%; height: 11%;
    background: var(--cd-face-mouth); border-radius: 6% 6% 50% 50%;
  }
  .sleep .m-eye { transform: scaleY(0.14); }
  .sleep .m-glint { opacity: 0; }
  .sleep .m-mouth {
    left: 44%; top: 64%; width: 12%; height: 4%;
    border-radius: 999px; background: var(--cd-face-ink);
  }
  .m-zzz {
    position: absolute; top: -4%; right: -14%;
    font-size: 0.24em; line-height: 1; font-weight: 700; color: var(--cd-ink-3);
  }
  .mascot.float { animation: cd-mascot-float 2.8s ease-in-out infinite; }
  @keyframes cd-mascot-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot.float { animation: none; }
  }

  /* ===== 记一笔 ===== */
  .type-switch {
    display: flex; background: var(--cd-cream); border-radius: var(--cd-r-md);
    margin: 12px 16px; padding: 4px;
  }
  .type-switch button {
    flex: 1; border: 0; background: transparent; padding: 9px 0; font-size: 14px;
    border-radius: var(--cd-r-sm); color: var(--cd-ink-2); font-family: inherit;
    transition: background-color .18s, color .18s;
  }
  .type-switch button.on {
    background: var(--cd-grad-brand); color: var(--cd-ink); font-weight: 700;
    box-shadow: 0 2px 6px rgba(240, 165, 0, 0.25);
  }

  .amount-card {
    display: flex; align-items: center; gap: 12px;
    margin: 0 16px 10px; padding: 14px 16px;
    background: var(--cd-surface); border-radius: var(--cd-r-md); box-shadow: var(--cd-sh-1);
  }
  .amount-box {
    flex: 1; min-width: 0; overflow: hidden;
    display: flex; align-items: baseline; justify-content: flex-end; gap: 6px;
  }
  .amount-box .cur { font-size: 18px; font-weight: 600; color: var(--cd-ink-2); }
  .amount-text {
    font-size: 30px; font-weight: 700; letter-spacing: .5px; white-space: nowrap;
    font-variant-numeric: tabular-nums; color: var(--cd-ink);
  }
  .amount-text.expense { color: var(--cd-expense); }
  .amount-text.income { color: var(--cd-income); }

  .cat-grid {
    display: flex; flex-wrap: wrap;
    margin: 4px 16px 10px; padding: 10px 6px 4px;
    background: var(--cd-surface); border-radius: var(--cd-r-md); box-shadow: var(--cd-sh-1);
  }
  .cat-item {
    width: 25%; border: 0; background: transparent; padding: 6px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--cd-ink); font-family: inherit;
  }
  .cat-item .cat-icon {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    transition: transform .18s, box-shadow .18s;
  }
  .cat-item .cat-name { font-size: 12px; color: var(--cd-ink-2); transition: color .18s; }
  .cat-item.active .cat-icon {
    background: var(--cd-grad-brand);
    box-shadow: 0 0 0 2px var(--cd-primary-dk), 0 3px 10px rgba(240, 165, 0, 0.3);
    transform: scale(1.06);
  }
  .cat-item.active .cat-name { color: var(--cd-ink); font-weight: 600; }
  .cat-item:active .cat-icon { transform: scale(0.92); }

  .meta-row { display: flex; gap: 8px; margin: 0 16px 12px; }
  .meta-row input {
    border: 0; border-radius: var(--cd-r-md); padding: 12px 14px; font-size: 14px;
    background: var(--cd-surface); box-shadow: var(--cd-sh-1);
    font-family: inherit; color: var(--cd-ink); min-width: 0;
  }
  #noteInput { flex: 1; }
  #dateInput { width: 152px; background: var(--cd-cream); box-shadow: none; font-weight: 600; font-size: 13px; }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 4px 16px;
  }
  .keypad button {
    height: 50px; border: 0; border-radius: var(--cd-r-sm); background: var(--cd-surface);
    font-size: 21px; font-weight: 700; color: var(--cd-ink); font-family: inherit;
    box-shadow: var(--cd-sh-1); transition: transform .18s, background-color .18s;
  }
  .keypad button:active { background: var(--cd-primary-lt); transform: scale(0.94); }
  .keypad button.del { background: var(--cd-cream); color: var(--cd-ink-2); font-size: 19px; box-shadow: none; }

  #btnConfirm {
    margin: 14px 16px 0; width: calc(100% - 32px); height: 50px; border: 0;
    border-radius: var(--cd-r-md); background: var(--cd-grad-brand); color: var(--cd-ink);
    font-size: 17px; font-weight: 700; font-family: inherit;
    box-shadow: 0 4px 14px rgba(240, 165, 0, 0.3);
    transition: transform .18s, opacity .18s;
  }
  #btnConfirm:active { opacity: .9; transform: scale(0.985); }
  #btnConfirm:disabled { background: var(--cd-cream); color: var(--cd-ink-3); box-shadow: none; }

  /* ===== 明细 ===== */
  .month-bar {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px;
  }
  .month-bar button {
    width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--cd-surface);
    font-size: 20px; font-weight: 700; color: var(--cd-ink); font-family: inherit;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--cd-sh-1);
  }
  .month-bar button:active { background: var(--cd-primary-lt); }
  .month-bar span { font-size: 16px; font-weight: 700; }

  .month-summary { display: flex; gap: 10px; margin: 0 16px 10px; }
  .month-summary .ms-item {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
    padding: 10px 14px; background: var(--cd-surface);
    border-radius: var(--cd-r-md); box-shadow: var(--cd-sh-1);
  }
  .month-summary .ms-label { font-size: 12px; color: var(--cd-ink-2); }
  .month-summary b {
    font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .month-summary .expense { color: var(--cd-expense); }
  .month-summary .income { color: var(--cd-income); }

  .day-card {
    margin: 0 16px 10px; background: var(--cd-surface);
    border-radius: var(--cd-r-md); box-shadow: var(--cd-sh-1); overflow: hidden;
  }
  .day-head { font-size: 12px; font-weight: 600; color: var(--cd-ink-2); padding: 12px 16px 8px; }
  .tx-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--cd-line); transition: background-color .18s;
  }
  .tx-item:last-child { border-bottom: 0; }
  .tx-item:active { background: var(--cd-cream-2); }
  .tx-icon {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none;
  }
  .tx-main { flex: 1; min-width: 0; }
  .tx-name { font-size: 15px; }
  .tx-note { font-size: 12px; color: var(--cd-ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amount {
    font-size: 19px; font-weight: 700; letter-spacing: .2px;
    font-variant-numeric: tabular-nums;
  }
  .tx-amount.expense { color: var(--cd-expense); }
  .tx-amount.income { color: var(--cd-income); }

  .empty {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 56px 32px 60px; color: var(--cd-ink-2); font-size: 13px;
  }
  .empty .empty-text { line-height: 1.9; text-align: center; }

  /* ===== 我的 ===== */
  .me-hero {
    display: flex; align-items: center; gap: 14px; margin: 12px 16px; padding: 16px;
    background: linear-gradient(135deg, var(--cd-cream) 0%, var(--cd-surface) 60%);
    border-radius: var(--cd-r-lg); box-shadow: var(--cd-sh-1);
  }
  .me-hero .hero-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .me-hero .hero-title { font-size: 17px; font-weight: 700; }
  .me-hero .hero-sub { font-size: 12px; color: var(--cd-ink-2); }

  .me-card {
    margin: 12px 16px; background: var(--cd-surface);
    border-radius: var(--cd-r-lg); overflow: hidden; box-shadow: var(--cd-sh-1);
  }
  .me-row {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid var(--cd-line); font-size: 15px;
  }
  .me-row:last-child { border-bottom: 0; }
  .me-row .arrow { margin-left: auto; color: var(--cd-ink-3); }
  .badge {
    margin-left: auto; font-size: 11px; color: var(--cd-ink-2);
    background: var(--cd-cream); padding: 3px 10px; border-radius: var(--cd-r-pill);
  }
  #btnReset {
    margin: 16px; width: calc(100% - 32px); height: 46px; border: 0;
    border-radius: var(--cd-r-md); background: var(--cd-danger-lt);
    color: var(--cd-danger-ink); font-size: 15px; font-weight: 600; font-family: inherit;
  }
  .me-version { text-align: center; color: var(--cd-ink-3); font-size: 12px; padding-bottom: 20px; }

  /* ===== 底部 Tab ===== */
  .tabbar {
    flex: none; display: flex; background: #fffdf7;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar .tab {
    flex: 1; border: 0; background: transparent; padding: 8px 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--cd-ink-2); font-size: 11px; font-family: inherit;
  }
  .tabbar .tab .ticon { font-size: 22px; }
  .tabbar .tab.active { color: #8a5a0f; font-weight: 700; }

  /* ===== 编辑弹层 ===== */
  .mask {
    position: absolute; inset: 0; background: rgba(61, 42, 23, 0.42);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--cd-surface);
    border-radius: var(--cd-r-lg) var(--cd-r-lg) 0 0;
    padding: 8px 16px 24px; transform: translateY(105%); transition: transform .25s;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grip { width: 44px; height: 5px; border-radius: var(--cd-r-pill); background: var(--cd-line); margin: 4px auto 14px; }
  .sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-title .stype {
    font-size: 12px; font-weight: 400; color: var(--cd-ink-2);
    background: var(--cd-cream); padding: 3px 10px; border-radius: var(--cd-r-pill);
  }
  .sheet input[type="text"], .sheet input[type="number"] {
    width: 100%; border: 1px solid var(--cd-line); border-radius: var(--cd-r-md);
    padding: 12px 14px; font-size: 16px; margin-bottom: 10px;
    background: var(--cd-cream-2); font-family: inherit; color: var(--cd-ink);
    font-variant-numeric: tabular-nums;
  }
  .sheet-cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; }
  .sheet-cats .chip {
    flex: none; border: 1px solid var(--cd-line); background: var(--cd-surface);
    border-radius: var(--cd-r-pill); padding: 8px 14px; font-size: 13px;
    color: var(--cd-ink); font-family: inherit; transition: background-color .18s, border-color .18s;
  }
  .sheet-cats .chip.active {
    border-color: var(--cd-primary-dk); background: var(--cd-primary);
    color: var(--cd-ink); font-weight: 600;
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .sheet-actions button {
    flex: 1; height: 46px; border-radius: var(--cd-r-md); border: 0;
    font-size: 16px; font-weight: 700; font-family: inherit;
  }
  #btnSheetSave { background: var(--cd-grad-brand); color: var(--cd-ink); box-shadow: 0 3px 10px rgba(240, 165, 0, 0.28); flex: 2; }
  #btnSheetDelete { background: var(--cd-danger-lt); color: var(--cd-danger-ink); }

  /* Toast */
  .toast {
    position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(61, 42, 23, 0.85); color: #fff; font-size: 13px; padding: 9px 18px;
    border-radius: var(--cd-r-pill); opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="phone">
  <div class="app-header">
    <div class="app-title">现金日记</div>
    <div class="demo-tag">演示原型 · 数据为模拟</div>
  </div>

  <main>
    <!-- 记一笔 -->
    <section class="page active" id="page-add">
      <div class="type-switch">
        <button id="typeExpense" class="on" onclick="setType('expense')">支出</button>
        <button id="typeIncome" onclick="setType('income')">收入</button>
      </div>
      <div class="amount-card">
        <span id="mascotAdd"></span>
        <div class="amount-box">
          <span class="cur">¥</span>
          <span class="amount-text expense" id="amountText">0.00</span>
        </div>
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="meta-row">
        <input id="noteInput" type="text" placeholder="备注（可选）" maxlength="30">
        <input id="dateInput" type="date">
      </div>
      <div class="keypad">
        <button onclick="pressKey('1')">1</button>
        <button onclick="pressKey('2')">2</button>
        <button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button>
        <button onclick="pressKey('5')">5</button>
        <button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button>
        <button onclick="pressKey('8')">8</button>
        <button onclick="pressKey('9')">9</button>
        <button onclick="pressKey('.')">.</button>
        <button onclick="pressKey('0')">0</button>
        <button class="del" onclick="pressKey('del')">⌫</button>
      </div>
      <button id="btnConfirm" onclick="confirmAdd()" disabled>完成</button>
    </section>

    <!-- 明细 -->
    <section class="page" id="page-list">
      <div class="month-bar">
        <button onclick="shiftMonth(-1)">‹</button>
        <span id="monthLabel"></span>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div class="month-summary">
        <div class="ms-item">
          <span class="ms-label">支出</span>
          <b class="expense" id="monthExpense">¥0.00</b>
        </div>
        <div class="ms-item">
          <span class="ms-label">收入</span>
          <b class="income" id="monthIncome">¥0.00</b>
        </div>
      </div>
      <div id="listBody"></div>
    </section>

    <!-- 我的 -->
    <section class="page" id="page-me">
      <div class="me-hero">
        <span id="mascotHero"></span>
        <div class="hero-main">
          <span class="hero-title">现金日记</span>
          <span class="hero-sub">今天想记点什么呢</span>
        </div>
      </div>
      <div class="me-card">
        <div class="me-row">分类管理 <span class="badge">P1 敬请期待</span></div>
        <div class="me-row">预算提醒 <span class="badge">P1 敬请期待</span></div>
        <div class="me-row">数据备份 <span class="badge">P2 敬请期待</span></div>
        <div class="me-row">关于现金日记 <span class="arrow">›</span></div>
      </div>
      <button id="btnReset" onclick="resetDemo()">重置演示数据</button>
      <div class="me-version">现金日记 v0.1 · MVP 交互原型</div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" id="tab-add" onclick="switchTab('add')"><span class="ticon">📝</span>记一笔</button>
    <button class="tab" id="tab-list" onclick="switchTab('list')"><span class="ticon">📒</span>明细</button>
    <button class="tab" id="tab-me" onclick="switchTab('me')"><span class="ticon">👤</span>我的</button>
  </nav>

  <!-- 编辑弹层 -->
  <div class="mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-title">编辑记录 <span class="stype" id="sheetTypeLabel"></span></div>
    <input type="number" id="sheetAmount" placeholder="金额" step="0.01" min="0">
    <div class="sheet-cats" id="sheetCats"></div>
    <input type="text" id="sheetNote" placeholder="备注（可选）" maxlength="30">
    <div class="sheet-actions">
      <button id="btnSheetDelete" onclick="sheetDelete()">删除</button>
      <button id="btnSheetSave" onclick="sheetSave()">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
/* 现金日记 · 交互演示原型
   数据全部为模拟：存于浏览器 localStorage，刷新/关闭即“杀进程”，可验证持久化体验。
   真实开发时将本文件的数据访问层替换为 SQLite 即可，页面结构与交互流程不变。

   视觉基准：本文件的 CSS 令牌与 src/App.vue 一致，改配色请两边同步。 */

var LS_KEY = 'cashDiary.demo.v1';

var CATEGORIES = [
  { id: 1,  name: '餐饮',     icon: '🍜', type: 'expense' },
  { id: 2,  name: '交通',     icon: '🚌', type: 'expense' },
  { id: 3,  name: '购物',     icon: '🛍️', type: 'expense' },
  { id: 4,  name: '住房',     icon: '🏠', type: 'expense' },
  { id: 5,  name: '通讯',     icon: '📱', type: 'expense' },
  { id: 6,  name: '娱乐',     icon: '🎮', type: 'expense' },
  { id: 7,  name: '医疗',     icon: '💊', type: 'expense' },
  { id: 8,  name: '其他支出', icon: '📦', type: 'expense' },
  { id: 9,  name: '工资',     icon: '💼', type: 'income' },
  { id: 10, name: '兼职',     icon: '🧧', type: 'income' },
  { id: 11, name: '红包',     icon: '🎁', type: 'income' },
  { id: 12, name: '其他收入', icon: '💰', type: 'income' }
];

/* 分类图标底色：与 src/utils/palette.js 同表，按 id 循环取色 */
var TINTS = ['#fff0be', '#e6f6ff', '#ffedf0', '#e8f8f0', '#fff1e3', '#ede9ff', '#e4f5f7', '#fbeaf2'];
function tintOf(id) { return TINTS[Math.abs(id - 1) % TINTS.length]; }

/* 吉祥物「小记龙」纯 CSS 结构，与 src/components/mascot/mascot.vue 同构 */
function mascotHtml(mood, size, float) {
  return '<span class="mascot ' + (mood || 'happy') + (float ? ' float' : '') + '" style="font-size:' + size + 'px">' +
    '<span class="m-tuft"></span>' +
    '<span class="m-head">' +
      '<span class="m-eye m-eye--l"><span class="m-glint"></span></span>' +
      '<span class="m-eye m-eye--r"><span class="m-glint"></span></span>' +
      '<span class="m-cheek m-cheek--l"></span>' +
      '<span class="m-cheek m-cheek--r"></span>' +
      '<span class="m-mouth"></span>' +
    '</span>' +
    (mood === 'sleep' ? '<span class="m-zzz">z</span>' : '') +
  '</span>';
}

/* ---------- 工具函数 ---------- */
function pad2(n) { return (n < 10 ? '0' : '') + n; }

function ymKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

function dayStart(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

function catById(id) {
  for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
  return null;
}
function recordById(id) {
  for (var i = 0; i < state.records.length; i++) if (state.records[i].id === id) return state.records[i];
  return null;
}

function fmtSigned(cents, type) {
  var s = (Math.abs(cents) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (type === 'expense' ? '-' : '+') + '¥' + s;
}

function fmtPlain(cents) {
  return '¥' + (cents / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function displayAmount(str) {
  if (!str) return '0.00';
  var parts = str.split('.');
  var intPart = parts[0] ? Number(parts[0]).toLocaleString('zh-CN') : '0';
  return parts.length > 1 ? intPart + '.' + parts[1] : intPart;
}

function dateLabel(ts) {
  var d = new Date(ts), now = new Date();
  var week = '日一二三四五六'[d.getDay()];
  var base = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + week;
  var diff = Math.round((dayStart(now.getTime()) - dayStart(ts)) / 86400000);
  if (diff === 0) return '今天 ' + base;
  if (diff === 1) return '昨天 ' + base;
  return base;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- 模拟数据 ---------- */
function makeSeed() {
  function ago(days, h, m) {
    var d = new Date();
    d.setDate(d.getDate() - days);
    d.setHours(h, m, 0, 0);
    return d.getTime();
  }
  return [
    { id: 101, categoryId: 9, type: 'income',  amountCents: 850000, note: '9月工资', ts: ago(20, 9, 0) },
    { id: 102, categoryId: 4, type: 'expense', amountCents: 180000, note: '房租',     ts: ago(19, 10, 0) },
    { id: 103, categoryId: 1, type: 'expense', amountCents: 3280,   note: '外卖',     ts: ago(6, 19, 30) },
    { id: 104, categoryId: 3, type: 'expense', amountCents: 6530,   note: '超市采购', ts: ago(1, 18, 5) },
    { id: 105, categoryId: 2, type: 'expense', amountCents: 400,    note: '地铁',     ts: ago(1, 8, 40) },
    { id: 106, categoryId: 1, type: 'expense', amountCents: 850,    note: '早餐',     ts: ago(0, 8, 15) },
    { id: 107, categoryId: 5, type: 'expense', amountCents: 5000,   note: '话费充值', ts: ago(0, 12, 0) },
    { id: 108, categoryId: 6, type: 'expense', amountCents: 3000,   note: '电影票',   ts: ago(0, 20, 45) }
  ];
}

function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 忽略损坏数据，回退到种子数据 */ }
  return { records: makeSeed() };
}

var state = loadState();
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ---------- 会话级 UI 状态 ---------- */
var ui = {
  tab: 'add',
  type: 'expense',
  catId: null,
  amount: '',
  ym: ymKey(Date.now()),
  editingId: null,
  sheetCatId: null
};

/* ---------- Toast ---------- */
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = 'toast'; }, 1600);
}

/* ---------- 页面切换 ---------- */
function switchTab(tab) {
  ui.tab = tab;
  ['add', 'list', 'me'].forEach(function (t) {
    document.getElementById('page-' + t).className = 'page' + (t === tab ? ' active' : '');
    document.getElementById('tab-' + t).className = 'tab' + (t === tab ? ' active' : '');
  });
  if (tab === 'list') renderList();
}

/* ---------- 记一笔 ---------- */
function setType(t) {
  ui.type = t;
  var cat = catById(ui.catId);
  if (!cat || cat.type !== t) ui.catId = null;
  document.getElementById('typeExpense').className = t === 'expense' ? 'on' : '';
  document.getElementById('typeIncome').className = t === 'income' ? 'on' : '';
  renderCats();
  renderAmount();
}

function renderCats() {
  var grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.filter(function (c) { return c.type === ui.type; }).forEach(function (c) {
    var btn = document.createElement('button');
    btn.className = 'cat-item' + (ui.catId === c.id ? ' active' : '');
    var icon = document.createElement('span');
    icon.className = 'cat-icon';
    icon.textContent = c.icon;
    /* 未选中才设底色；选中态交给 CSS 的主黄渐变 */
    if (ui.catId !== c.id) icon.style.background = tintOf(c.id);
    var name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = c.name;
    btn.appendChild(icon);
    btn.appendChild(name);
    btn.onclick = function () { ui.catId = c.id; renderCats(); renderAmount(); };
    grid.appendChild(btn);
  });
}

function renderAmount() {
  var el = document.getElementById('amountText');
  el.textContent = displayAmount(ui.amount);
  el.className = 'amount-text ' + ui.type;
  document.getElementById('btnConfirm').disabled = !(parseFloat(ui.amount) > 0 && ui.catId);
}

function pressKey(k) {
  if (k === 'del') {
    ui.amount = ui.amount.slice(0, -1);
  } else if (k === '.') {
    if (ui.amount.indexOf('.') === -1) ui.amount = ui.amount ? ui.amount + '.' : '0.';
  } else {
    var parts = ui.amount.split('.');
    if (parts.length === 2 && parts[1].length >= 2) return;      // 小数最多 2 位
    if (parts[0].replace(/^0+/, '').length >= 9) return;          // 整数最多 9 位
    ui.amount += k;
  }
  renderAmount();
}

function confirmAdd() {
  var cents = Math.round(parseFloat(ui.amount) * 100);
  if (!(cents > 0) || !ui.catId) return;

  var now = new Date();
  var dstr = document.getElementById('dateInput').value;          // yyyy-mm-dd
  var ts = dstr
    ? new Date(dstr + 'T' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':00').getTime()
    : now.getTime();

  state.records.push({
    id: Date.now(),
    categoryId: ui.catId,
    type: ui.type,
    amountCents: cents,
    note: document.getElementById('noteInput').value.trim(),
    ts: ts
  });
  save();

  ui.amount = '';
  document.getElementById('noteInput').value = '';
  renderAmount();
  toast('已记一笔');
  // 保留类型与分类，便于连续记账
}

/* ---------- 明细 ---------- */
function shiftMonth(delta) {
  var parts = ui.ym.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
  ui.ym = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  renderList();
}

function makeItem(r) {
  var cat = catById(r.categoryId) || { icon: '❓', name: '未知' };
  var el = document.createElement('div');
  el.className = 'tx-item';
  var noteHtml = r.note ? '<div class="tx-note">' + escapeHtml(r.note) + '</div>' : '';
  el.innerHTML =
    '<div class="tx-icon" style="background:' + tintOf(r.categoryId) + '">' + cat.icon + '</div>' +
    '<div class="tx-main"><div class="tx-name">' + cat.name + '</div>' + noteHtml + '</div>' +
    '<div class="tx-amount ' + r.type + '">' + fmtSigned(r.amountCents, r.type) + '</div>';
  el.onclick = function () { openSheet(r.id); };
  return el;
}

function renderList() {
  document.getElementById('monthLabel').textContent = ui.ym.replace('-', '年') + '月';

  var recs = state.records.filter(function (r) { return ymKey(r.ts) === ui.ym; });
  var expense = 0, income = 0;
  recs.forEach(function (r) { if (r.type === 'expense') expense += r.amountCents; else income += r.amountCents; });
  document.getElementById('monthExpense').textContent = fmtPlain(expense);
  document.getElementById('monthIncome').textContent = fmtPlain(income);

  var box = document.getElementById('listBody');
  box.innerHTML = '';
  if (!recs.length) {
    // 空状态：打盹的吉祥物 + 引导文案
    box.innerHTML = '<div class="empty">' + mascotHtml('sleep', 108, true) +
      '<div class="empty-text">这个月还没有记录，去「记一笔」补上吧</div></div>';
    return;
  }

  var groups = {};
  recs.forEach(function (r) { var k = dayStart(r.ts); (groups[k] = groups[k] || []).push(r); });
  var keys = Object.keys(groups).sort(function (a, b) { return Number(b) - Number(a); });

  keys.forEach(function (k) {
    var card = document.createElement('div');
    card.className = 'day-card';

    var head = document.createElement('div');
    head.className = 'day-head';
    head.textContent = dateLabel(Number(k));
    card.appendChild(head);

    groups[k].sort(function (a, b) { return b.ts - a.ts; }).forEach(function (r) {
      card.appendChild(makeItem(r));
    });

    box.appendChild(card);
  });
}

/* ---------- 编辑弹层 ---------- */
function openSheet(id) {
  var r = recordById(id);
  if (!r) return;
  ui.editingId = id;
  ui.sheetCatId = r.categoryId;
  document.getElementById('sheetAmount').value = (r.amountCents / 100).toFixed(2);
  document.getElementById('sheetNote').value = r.note || '';
  document.getElementById('sheetTypeLabel').textContent = r.type === 'expense' ? '支出' : '收入';
  renderSheetCats(r.type);
  document.getElementById('mask').className = 'mask show';
  document.getElementById('sheet').className = 'sheet open';
}

function closeSheet() {
  document.getElementById('mask').className = 'mask';
  document.getElementById('sheet').className = 'sheet';
  ui.editingId = null;
}

function renderSheetCats(type) {
  var box = document.getElementById('sheetCats');
  box.innerHTML = '';
  CATEGORIES.filter(function (c) { return c.type === type; }).forEach(function (c) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (ui.sheetCatId === c.id ? ' active' : '');
    chip.textContent = c.icon + ' ' + c.name;
    chip.onclick = function () { ui.sheetCatId = c.id; renderSheetCats(type); };
    box.appendChild(chip);
  });
}

function sheetSave() {
  var r = recordById(ui.editingId);
  if (!r) return;
  var cents = Math.round(parseFloat(document.getElementById('sheetAmount').value) * 100);
  if (!(cents > 0)) { toast('金额要大于 0'); return; }
  if (!ui.sheetCatId) { toast('请选择一个分类'); return; }
  r.amountCents = cents;
  r.categoryId = ui.sheetCatId;
  r.note = document.getElementById('sheetNote').value.trim();
  save();
  closeSheet();
  renderList();
  toast('已保存');
}

function sheetDelete() {
  if (!confirm('确定删除这条记录吗？')) return;
  state.records = state.records.filter(function (r) { return r.id !== ui.editingId; });
  save();
  closeSheet();
  renderList();
  toast('已删除');
}

/* ---------- 我的 ---------- */
function resetDemo() {
  if (!confirm('重置为初始演示数据？')) return;
  localStorage.removeItem(LS_KEY);
  state = { records: makeSeed() };
  ui.ym = ymKey(Date.now());
  save();
  renderList();
  toast('已重置演示数据');
}

/* ---------- 初始化 ---------- */
/* 吉祥物挂载：尺寸与 src/pages/*.vue 中传入的 size 保持一致 */
document.getElementById('mascotAdd').innerHTML = mascotHtml('happy', 46);
document.getElementById('mascotHero').innerHTML = mascotHtml('happy', 64);
document.getElementById('dateInput').valueAsDate = new Date();
renderCats();
renderAmount();
renderList();
</script>
</body>
</html>
